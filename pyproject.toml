[project]
name = "incident-awareness-engine"
version = "0.1.0"
description = "Incident awareness and evidence automation system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "jsonschema>=4.25,<5",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
    "pandas>=3.0.5",
    "boto3>=1.43.102",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "scikit-learn>=1.7,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.4,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
