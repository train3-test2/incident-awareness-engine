[project]
name = "incident-awareness-engine"
version = "0.1.0"
description = "Incident awareness and evidence automation system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "jsonschema>=4.25,<5",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.4,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
