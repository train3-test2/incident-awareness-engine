name: CI and AWS smoke deploy

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      INCIDENT_AWARENESS_EVENT_TYPES_PATH: configs/event_types_v0.2.yaml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Node runs the Dashboard UI contract tests with its built-in test runner only;
      # there is no package.json, npm install, or frontend build.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: >-
          node --test
          tests/dashboard/ui/test_dashboard_contract.mjs
          tests/dashboard/ui/test_operations_contract.mjs
          tests/dashboard/ui/test_run_detail_contract.mjs
          tests/dashboard/ui/test_decision_detail_contract.mjs
          tests/dashboard/ui/test_event_timeline_contract.mjs
          tests/dashboard/ui/test_event_detail_contract.mjs
      - name: Scan secrets with gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --log-opts="--all"

  # The scenario runners are Windows PowerShell 5.1 scripts, which the quality
  # job cannot run. Their guard tests use fakes only: no VM, no WinRM session,
  # no TCP connection and no AWS call is made here.
  powershell-guards:
    name: PowerShell guards (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      # The scripts are ASCII files stored with LF. Keep them as stored.
      - name: Keep line endings as stored
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "the guard tests target Windows PowerShell 5.1"
          }
      - name: R1 run guards
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scenarios\R1\tests\Test-R1RunGuards.ps1
          exit $LASTEXITCODE
      - name: S0 run guards
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scenarios\S0\tests\Test-RunCommonGuards.ps1
          exit $LASTEXITCODE

  aws-smoke-deploy:
    name: Build, publish, and run AWS smoke task
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      ECS_FIRST_CYCLE_TASK_ROLE_ARN: ${{ vars.ECS_FIRST_CYCLE_TASK_ROLE_ARN }}
      ECS_FIRST_CYCLE_WORKER_SERVICE: ${{ vars.ECS_FIRST_CYCLE_WORKER_SERVICE }}
      FIRST_CYCLE_DATABASE_URL_SECRET_ARN: ${{ vars.FIRST_CYCLE_DATABASE_URL_SECRET_ARN }}
      FIRST_CYCLE_S3_BUCKET: ${{ vars.FIRST_CYCLE_S3_BUCKET }}
      FIRST_CYCLE_SQS_QUEUE_URL: ${{ vars.FIRST_CYCLE_SQS_QUEUE_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate AWS deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          for value in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SUBNET_IDS ECS_SECURITY_GROUP_IDS ECS_EXECUTION_ROLE_ARN ECS_FIRST_CYCLE_TASK_ROLE_ARN ECS_FIRST_CYCLE_WORKER_SERVICE FIRST_CYCLE_DATABASE_URL_SECRET_ARN FIRST_CYCLE_S3_BUCKET FIRST_CYCLE_SQS_QUEUE_URL; do
            if [ -z "${!value}" ]; then
              echo "GitHub Actions variable $value must be configured."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Render Worker task definition
        run: |
          python scripts/render_ecs_task_definition.py \
            --template infra/ecs/task-definition.first-cycle-worker.json \
            --output "$RUNNER_TEMP/task-definition.first-cycle-worker.json" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --task-role-arn "$ECS_FIRST_CYCLE_TASK_ROLE_ARN" \
            --database-url-secret-arn "$FIRST_CYCLE_DATABASE_URL_SECRET_ARN" \
            --sqs-queue-url "$FIRST_CYCLE_SQS_QUEUE_URL" \
            --s3-input-bucket "$FIRST_CYCLE_S3_BUCKET"

      - name: Register Worker task definition
        id: worker-task-definition
        run: |
          set -euo pipefail
          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/task-definition.first-cycle-worker.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Render First Cycle migration task definition
        run: |
          python scripts/render_ecs_task_definition.py \
            --template infra/ecs/task-definition.first-cycle-migrate.json \
            --output "$RUNNER_TEMP/task-definition.first-cycle-migrate.json" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --database-url-secret-arn "$FIRST_CYCLE_DATABASE_URL_SECRET_ARN"

      - name: Register First Cycle migration task definition
        id: migration-task-definition
        run: |
          set -euo pipefail
          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/task-definition.first-cycle-migrate.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Run First Cycle migrations
        env:
          MIGRATION_TASK_DEFINITION_ARN: ${{ steps.migration-task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          task_arn="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATION_TASK_DEFINITION_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET_IDS],securityGroups=[$ECS_SECURITY_GROUP_IDS],assignPublicIp=ENABLED}" \
            --count 1 \
            --query 'tasks[0].taskArn' \
            --output text)"
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "Failed to start the First Cycle migration task."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          if [[ "$exit_code" != "0" ]]; then
            stopped_reason="$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].stoppedReason' \
              --output text)"
            echo "First Cycle migration task failed: exit_code=$exit_code stopped_reason=$stopped_reason"
            exit 1
          fi

      - name: Create or update Worker service
        env:
          WORKER_TASK_DEFINITION_ARN: ${{ steps.worker-task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          service_arn="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FIRST_CYCLE_WORKER_SERVICE" \
            --query 'services[0].serviceArn' \
            --output text)"

          if [[ "$service_arn" == "None" ]]; then
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_FIRST_CYCLE_WORKER_SERVICE" \
              --task-definition "$WORKER_TASK_DEFINITION_ARN" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET_IDS],securityGroups=[$ECS_SECURITY_GROUP_IDS],assignPublicIp=ENABLED}"
          else
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_FIRST_CYCLE_WORKER_SERVICE" \
              --task-definition "$WORKER_TASK_DEFINITION_ARN" \
              --desired-count 1 \
              --force-new-deployment
          fi

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FIRST_CYCLE_WORKER_SERVICE"

      - name: Render ECS task definition
        run: |
          python scripts/render_ecs_task_definition.py \
            --template infra/ecs/task-definition.smoke.json \
            --output "$RUNNER_TEMP/task-definition.smoke.json" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --execution-role-arn "$ECS_EXECUTION_ROLE_ARN"

      - name: Render ECS task definition image
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.smoke.json
          container-name: incident-awareness-engine-smoke
          image: ${{ steps.image.outputs.uri }}

      - name: Register and run ECS smoke task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ env.ECS_SUBNET_IDS }}
          run-task-security-groups: ${{ env.ECS_SECURITY_GROUP_IDS }}
          run-task-assign-public-IP: ENABLED
          wait-for-task-stopped: true
          wait-max-delay-seconds: 15

  dashboard-deploy:
    name: Deploy Dashboard ECS service
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: aws-smoke-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_DASHBOARD_SERVICE: ${{ vars.ECS_DASHBOARD_SERVICE }}
      IMAGE_URI: ${{ needs.aws-smoke-deploy.outputs.image_uri }}
      DASHBOARD_EXECUTION_ROLE_ARN: ${{ vars.DASHBOARD_EXECUTION_ROLE_ARN }}
      DASHBOARD_DATABASE_URL_SECRET_ARN: ${{ vars.DASHBOARD_DATABASE_URL_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate Dashboard image URI
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_URI//[[:space:]]/}" ]]; then
            echo "The smoke deployment did not publish an image URI."
            exit 1
          fi

          expected_suffix=":${GITHUB_SHA}"
          if [[ "$IMAGE_URI" != *"$expected_suffix" ]]; then
            echo "Dashboard image URI must use the current commit SHA tag."
            exit 1
          fi

      - name: Validate Dashboard deployment configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          for value in AWS_ROLE_ARN AWS_REGION ECS_CLUSTER ECS_DASHBOARD_SERVICE DASHBOARD_EXECUTION_ROLE_ARN DASHBOARD_DATABASE_URL_SECRET_ARN; do
            if [[ -z "${!value//[[:space:]]/}" ]]; then
              echo "GitHub Actions variable $value must be configured."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render Dashboard task definition
        shell: bash
        run: |
          python scripts/render_ecs_task_definition.py \
            --template infra/ecs/task-definition.dashboard.json \
            --output "$RUNNER_TEMP/task-definition.dashboard.json" \
            --image-uri "$IMAGE_URI" \
            --execution-role-arn "$DASHBOARD_EXECUTION_ROLE_ARN" \
            --database-url-secret-arn "$DASHBOARD_DATABASE_URL_SECRET_ARN"

      - name: Register Dashboard task definition revision
        id: register-dashboard-task-definition
        shell: bash
        run: |
          set -euo pipefail

          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json "file://$RUNNER_TEMP/task-definition.dashboard.json" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"
          echo "task_definition_arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Update Dashboard ECS service
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-dashboard-task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_DASHBOARD_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for Dashboard service stability
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_DASHBOARD_SERVICE"

      - name: Verify running Dashboard task
        id: dashboard-task
        shell: bash
        run: |
          set -euo pipefail

          service_state="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_DASHBOARD_SERVICE" \
              --query 'services[0].[desiredCount,runningCount,pendingCount]' \
              --output text
          )"
          read -r desired_count running_count pending_count <<< "$service_state"
          if [[ "$desired_count" != "1" || "$running_count" != "1" || "$pending_count" != "0" ]]; then
            echo "Dashboard service did not reach the expected 1/1/0 state: $service_state"
            exit 1
          fi

          task_arn="$(
            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_DASHBOARD_SERVICE" \
              --desired-status RUNNING \
              --query 'taskArns[0]' \
              --output text
          )"
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "Dashboard service is stable but has no running task."
            exit 1
          fi

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].lastStatus' \
            --output text | grep -Fx 'RUNNING'
          echo "task_arn=$task_arn" >> "$GITHUB_OUTPUT"

      - name: Summarize Dashboard endpoint
        shell: bash
        env:
          TASK_ARN: ${{ steps.dashboard-task.outputs.task_arn }}
          TASK_DEFINITION_ARN: ${{ steps.register-dashboard-task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          network_interface_id="$(
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --query "tasks[0].attachments[?type=='ElasticNetworkInterface'].details[?name=='networkInterfaceId'].value | [0]" \
              --output text
          )"
          if [[ -z "$network_interface_id" || "$network_interface_id" == "None" ]]; then
            echo "Dashboard task has no network interface."
            exit 1
          fi

          public_ip="$(
            aws ec2 describe-network-interfaces \
              --network-interface-ids "$network_interface_id" \
              --query 'NetworkInterfaces[0].Association.PublicIp' \
              --output text
          )"
          if [[ -z "$public_ip" || "$public_ip" == "None" ]]; then
            echo "Dashboard task has no public IP address."
            exit 1
          fi

          {
            echo "## Dashboard deployment"
            echo
            echo "- Service: \`$ECS_DASHBOARD_SERVICE\`"
            echo "- Task definition: \`$TASK_DEFINITION_ARN\`"
            echo "- Running task: \`$TASK_ARN\`"
            echo "- Dashboard: [http://$public_ip:8080/dashboard](http://$public_ip:8080/dashboard)"
            echo "- Health check: \`curl --fail http://$public_ip:8080/healthz\`"
            echo
            echo "> Run the health check from a client IP allowed by the Dashboard task security group. The Fargate public IP changes when the task is replaced."
          } >> "$GITHUB_STEP_SUMMARY"
