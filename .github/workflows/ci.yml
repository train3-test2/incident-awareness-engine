name: CI and AWS smoke deploy

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      INCIDENT_AWARENESS_EVENT_TYPES_PATH: configs/event_types_v0.2.yaml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Node runs the Dashboard UI contract tests with its built-in test runner only;
      # there is no package.json, npm install, or frontend build.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: >-
          node --test
          tests/dashboard/ui/test_dashboard_contract.mjs
          tests/dashboard/ui/test_operations_contract.mjs
          tests/dashboard/ui/test_run_detail_contract.mjs
          tests/dashboard/ui/test_decision_detail_contract.mjs
          tests/dashboard/ui/test_event_timeline_contract.mjs
          tests/dashboard/ui/test_event_detail_contract.mjs
      - name: Scan secrets with gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --log-opts="--all"

  # The scenario runners are Windows PowerShell 5.1 scripts, which the quality
  # job cannot run. Their guard tests use fakes only: no VM, no WinRM session,
  # no TCP connection and no AWS call is made here.
  powershell-guards:
    name: PowerShell guards (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      # The scripts are ASCII files stored with LF. Keep them as stored.
      - name: Keep line endings as stored
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "the guard tests target Windows PowerShell 5.1"
          }
      - name: R1 run guards
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scenarios\R1\tests\Test-R1RunGuards.ps1
          exit $LASTEXITCODE
      - name: S0 run guards
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scenarios\S0\tests\Test-RunCommonGuards.ps1
          exit $LASTEXITCODE

  aws-smoke-deploy:
    name: Build, publish, and run AWS smoke task
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate AWS deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          for value in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SUBNET_IDS ECS_SECURITY_GROUP_IDS ECS_EXECUTION_ROLE_ARN; do
            if [ -z "${!value}" ]; then
              echo "GitHub Actions variable $value must be configured."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        run: |
          python scripts/render_ecs_task_definition.py \
            --template infra/ecs/task-definition.smoke.json \
            --output "$RUNNER_TEMP/task-definition.smoke.json" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --execution-role-arn "$ECS_EXECUTION_ROLE_ARN"

      - name: Render ECS task definition image
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.smoke.json
          container-name: incident-awareness-engine-smoke
          image: ${{ steps.image.outputs.uri }}

      - name: Register and run ECS smoke task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ env.ECS_SUBNET_IDS }}
          run-task-security-groups: ${{ env.ECS_SECURITY_GROUP_IDS }}
          run-task-assign-public-IP: ENABLED
          wait-for-task-stopped: true
          wait-max-delay-seconds: 15

  dashboard-deploy:
    name: Deploy Dashboard ECS service
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: aws-smoke-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_URI: ${{ needs.aws-smoke-deploy.outputs.image_uri }}
      DASHBOARD_EXECUTION_ROLE_ARN: ${{ vars.DASHBOARD_EXECUTION_ROLE_ARN }}
      DASHBOARD_DATABASE_URL_SECRET_ARN: ${{ vars.DASHBOARD_DATABASE_URL_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate Dashboard image URI
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_URI//[[:space:]]/}" ]]; then
            echo "The smoke deployment did not publish an image URI."
            exit 1
          fi

          expected_suffix=":${GITHUB_SHA}"
          if [[ "$IMAGE_URI" != *"$expected_suffix" ]]; then
            echo "Dashboard image URI must use the current commit SHA tag."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render Dashboard task definition
        shell: bash
        run: |
          python scripts/render_ecs_task_definition.py \
            --template infra/ecs/task-definition.dashboard.json \
            --output "$RUNNER_TEMP/task-definition.dashboard.json" \
            --image-uri "$IMAGE_URI" \
            --execution-role-arn "$DASHBOARD_EXECUTION_ROLE_ARN" \
            --database-url-secret-arn "$DASHBOARD_DATABASE_URL_SECRET_ARN"

      - name: Register Dashboard task definition revision
        id: register-dashboard-task-definition
        shell: bash
        run: |
          set -euo pipefail

          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json "file://$RUNNER_TEMP/task-definition.dashboard.json" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"
          echo "task_definition_arn=$task_definition_arn" >> "$GITHUB_OUTPUT"
