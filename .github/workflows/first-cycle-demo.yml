name: Prepare First Cycle demo inputs

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: first-cycle-demo-input-upload
  cancel-in-progress: false

jobs:
  prepare-demo-inputs:
    name: Prepare versioned demo inputs
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.identifiers.outputs.run_id }}
      entity_id: ${{ steps.identifiers.outputs.entity_id }}
      decision_id: ${{ steps.identifiers.outputs.decision_id }}
      decision_config_version: ${{ steps.identifiers.outputs.decision_config_version }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_uri: ${{ steps.image.outputs.image_uri }}
      task_definition_arn: ${{ steps.register.outputs.task_definition_arn }}
      task_arn: ${{ steps.run_task.outputs.task_arn }}
      task_id: ${{ steps.run_task.outputs.task_id }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FIRST_CYCLE_S3_BUCKET: ${{ vars.FIRST_CYCLE_S3_BUCKET }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate S3 upload configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          for value in AWS_ROLE_ARN AWS_REGION FIRST_CYCLE_S3_BUCKET ECR_REPOSITORY ECS_CLUSTER ECS_SUBNET_IDS ECS_SECURITY_GROUP_IDS; do
            if [[ -z "${!value//[[:space:]]/}" ]]; then
              echo "GitHub Actions variable $value must be configured."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify commit image exists in ECR
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_tag="$GITHUB_SHA"
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$image_tag" \
            > /dev/null

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_uri="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Allocate demo identifiers
        id: identifiers
        shell: bash
        run: |
          set -euo pipefail

          run_date="$(date -u +%Y%m%d)"
          initial_sequence="$(( (GITHUB_RUN_NUMBER - 1) % 999 + 1 ))"
          run_id=""

          for ((offset = 0; offset < 999; offset++)); do
            sequence="$(( (initial_sequence + offset - 1) % 999 + 1 ))"
            candidate="RUN-${run_date}-$(printf '%03d' "$sequence")"
            key_count="$(
              aws s3api list-objects-v2 \
                --bucket "$FIRST_CYCLE_S3_BUCKET" \
                --prefix "first-cycle/$candidate/" \
                --max-keys 1 \
                --query 'KeyCount' \
                --output text
            )"
            if [[ "$key_count" == "0" ]]; then
              run_id="$candidate"
              break
            fi
          done

          if [[ -z "$run_id" ]]; then
            echo "No unused First Cycle run_id remains for UTC date $run_date."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "entity_id=WIN-01" >> "$GITHUB_OUTPUT"
          echo "decision_id=DEC-$run_id" >> "$GITHUB_OUTPUT"
          echo "decision_config_version=parallel-v0.2" >> "$GITHUB_OUTPUT"

      - name: Materialize First Cycle demo inputs
        shell: bash
        env:
          RUN_ID: ${{ steps.identifiers.outputs.run_id }}
        run: |
          set -euo pipefail

          uv sync --all-groups --locked
          uv run python -m incident_awareness.pipeline.demo_seed \
            --seed-root tests/fixtures/pipeline/first_cycle \
            --destination "$RUNNER_TEMP/first-cycle-demo-inputs" \
            --run-id "$RUN_ID"

      - name: Upload demo inputs to S3
        shell: bash
        env:
          RUN_ID: ${{ steps.identifiers.outputs.run_id }}
        run: |
          set -euo pipefail

          prefix="first-cycle/$RUN_ID"
          aws s3 cp \
            "$RUNNER_TEMP/first-cycle-demo-inputs/" \
            "s3://$FIRST_CYCLE_S3_BUCKET/$prefix/" \
            --recursive \
            --only-show-errors

          required_keys=(
            "$prefix/run_metadata.json"
            "$prefix/manifest.json"
            "$prefix/sysmon-0001.jsonl"
            "$prefix/fast/hits.jsonl"
            "$prefix/fast/trace.json"
            "$prefix/fast/selection.json"
            "$prefix/fast/handoff.csv"
            "$prefix/fast/config.json"
          )
          for key in "${required_keys[@]}"; do
            aws s3api head-object --bucket "$FIRST_CYCLE_S3_BUCKET" --key "$key" > /dev/null
          done

      - name: Upload prepared demo inputs
        uses: actions/upload-artifact@v4
        with:
          name: first-cycle-demo-inputs-${{ steps.identifiers.outputs.run_id }}
          path: ${{ runner.temp }}/first-cycle-demo-inputs
          if-no-files-found: error
          retention-days: 1

      - name: Render First Cycle task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/task-definition.first-cycle.json
          container-name: incident-awareness-engine-first-cycle
          image: ${{ steps.image.outputs.image_uri }}

      - name: Register First Cycle task definition revision
        id: register
        shell: bash
        run: |
          set -euo pipefail

          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json "file://${{ steps.render.outputs.task-definition }}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"
          echo "task_definition_arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Run First Cycle Fargate task
        id: run_task
        shell: bash
        env:
          RUN_ID: ${{ steps.identifiers.outputs.run_id }}
          ENTITY_ID: ${{ steps.identifiers.outputs.entity_id }}
          DECISION_ID: ${{ steps.identifiers.outputs.decision_id }}
          DECISION_CONFIG_VERSION: ${{ steps.identifiers.outputs.decision_config_version }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          jq -n \
            --arg s3_input_uri "s3://$FIRST_CYCLE_S3_BUCKET/first-cycle/$RUN_ID/" \
            --arg entity_id "$ENTITY_ID" \
            --arg decision_id "$DECISION_ID" \
            --arg decision_config_version "$DECISION_CONFIG_VERSION" \
            '{
              containerOverrides: [{
                name: "incident-awareness-engine-first-cycle",
                environment: [
                  {name: "INCIDENT_AWARENESS_S3_INPUT_URI", value: $s3_input_uri},
                  {name: "INCIDENT_AWARENESS_ENTITY_ID", value: $entity_id},
                  {name: "INCIDENT_AWARENESS_DECISION_ID", value: $decision_id},
                  {name: "INCIDENT_AWARENESS_DECISION_CONFIG_VERSION", value: $decision_config_version}
                ]
              }]
            }' > overrides.json

          result="$(
            aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --task-definition "$TASK_DEFINITION_ARN" \
              --launch-type FARGATE \
              --count 1 \
              --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET_IDS],securityGroups=[$ECS_SECURITY_GROUP_IDS],assignPublicIp=ENABLED}" \
              --overrides file://overrides.json
          )"

          if [[ "$(jq '.failures | length' <<< "$result")" != "0" ]]; then
            jq '.failures' <<< "$result"
            exit 1
          fi

          task_arn="$(jq -r '.tasks[0].taskArn' <<< "$result")"
          if [[ -z "$task_arn" || "$task_arn" == "null" ]]; then
            echo "ECS did not return a task ARN."
            exit 1
          fi

          echo "task_arn=$task_arn" >> "$GITHUB_OUTPUT"
          echo "task_id=${task_arn##*/}" >> "$GITHUB_OUTPUT"

      - name: Wait for task completion
        shell: bash
        timeout-minutes: 60
        env:
          TASK_ARN: ${{ steps.run_task.outputs.task_arn }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 55 * 60))
          while (( SECONDS < deadline )); do
            status="$(
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks "$TASK_ARN" \
                --query 'tasks[0].lastStatus' \
                --output text \
                --cli-connect-timeout 10 \
                --cli-read-timeout 10
            )"
            if [[ "$status" == "STOPPED" ]]; then
              exit 0
            fi
            sleep 15
          done

          echo "Timed out waiting for ECS task to stop after 55 minutes."
          exit 1

      - name: Summarize task result
        if: always() && steps.run_task.outputs.task_arn != ''
        shell: bash
        env:
          TASK_ARN: ${{ steps.run_task.outputs.task_arn }}
          TASK_ID: ${{ steps.run_task.outputs.task_id }}
        run: |
          set -euo pipefail

          task="$(
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN"
          )"
          container="$(jq '.tasks[0].containers[] | select(.name == "incident-awareness-engine-first-cycle")' <<< "$task")"
          exit_code="$(jq -r '.exitCode // "missing"' <<< "$container")"
          stop_code="$(jq -r '.tasks[0].stopCode // ""' <<< "$task")"
          stopped_reason="$(jq -r '.tasks[0].stoppedReason // ""' <<< "$task")"
          log_group="/ecs/incident-awareness-engine-dev"
          log_stream="ecs/incident-awareness-engine-first-cycle/$TASK_ID"
          encoded_group="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$log_group")"
          encoded_stream="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$log_stream")"
          log_url="https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#logsV2:log-groups/log-group/${encoded_group}/log-events/${encoded_stream}"

          {
            echo "## First Cycle demo task result"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Task ARN | \`$TASK_ARN\` |"
            echo "| Exit code | \`$exit_code\` |"
            echo "| Stop code | $stop_code |"
            echo "| Stopped reason | $stopped_reason |"
            echo "| CloudWatch Logs | [Open log stream]($log_url) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$exit_code" != "0" ]]; then
            echo "First Cycle task failed with exit code $exit_code."
            exit 1
          fi

      - name: Write demo input summary
        shell: bash
        env:
          RUN_ID: ${{ steps.identifiers.outputs.run_id }}
          ENTITY_ID: ${{ steps.identifiers.outputs.entity_id }}
          DECISION_ID: ${{ steps.identifiers.outputs.decision_id }}
          DECISION_CONFIG_VERSION: ${{ steps.identifiers.outputs.decision_config_version }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task_definition_arn }}
          TASK_ARN: ${{ steps.run_task.outputs.task_arn }}
        run: |
          {
            echo "## First Cycle demo inputs prepared"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Seed | s0-attack-fixture-v1 |"
            echo "| Run ID | \`$RUN_ID\` |"
            echo "| Entity ID | \`$ENTITY_ID\` |"
            echo "| Decision ID | \`$DECISION_ID\` |"
            echo "| Decision config version | \`$DECISION_CONFIG_VERSION\` |"
            echo "| ECR image | \`$IMAGE_URI\` |"
            echo "| S3 input | \`s3://$FIRST_CYCLE_S3_BUCKET/first-cycle/$RUN_ID/\` |"
            echo "| Task definition | \`$TASK_DEFINITION_ARN\` |"
            echo "| Task ARN | \`$TASK_ARN\` |"
            echo
            echo "The next workflow stage waits for task completion and reports its result."
          } >> "$GITHUB_STEP_SUMMARY"
