services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-incident_awareness_local}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-incident_admin}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?LOCAL_POSTGRES_PASSWORD must be set in .env.localstack}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-54330}:5432"
    volumes:
      - incident_awareness_localstack_postgres_data:/var/lib/postgresql
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  localstack:
    image: localstack/localstack:4.12.0
    environment:
      AWS_DEFAULT_REGION: ${LOCAL_AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SERVICES: s3,sqs
      SQS_ENDPOINT_STRATEGY: path
      LOCAL_FIRST_CYCLE_BUCKET: ${LOCAL_FIRST_CYCLE_BUCKET:-incident-awareness-local-first-cycle}
      LOCAL_FIRST_CYCLE_QUEUE: ${LOCAL_FIRST_CYCLE_QUEUE:-incident-awareness-local-first-cycle-ingest}
      LOCAL_FIRST_CYCLE_DLQ: ${LOCAL_FIRST_CYCLE_DLQ:-incident-awareness-local-first-cycle-dlq}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
      # PERSISTENCE is intentionally disabled: this volume does not preserve S3/SQS state.
      - incident_awareness_localstack_state:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name \"$$LOCAL_FIRST_CYCLE_QUEUE\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

  first-cycle-worker:
    build: .
    command: ["python", "-m", "incident_awareness.pipeline.sqs_worker"]
    environment:
      INCIDENT_AWARENESS_DATABASE_URL: ${LOCAL_DATABASE_URL:?LOCAL_DATABASE_URL must be set in .env.localstack}
      INCIDENT_AWARENESS_SQS_QUEUE_URL: http://localstack:4566/queue/${LOCAL_AWS_REGION:-ap-northeast-2}/000000000000/${LOCAL_FIRST_CYCLE_QUEUE:-incident-awareness-local-first-cycle-ingest}
      INCIDENT_AWARENESS_S3_INPUT_BUCKET: ${LOCAL_FIRST_CYCLE_BUCKET:-incident-awareness-local-first-cycle}
      INCIDENT_AWARENESS_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${LOCAL_AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  incident_awareness_localstack_postgres_data:
  incident_awareness_localstack_state:
