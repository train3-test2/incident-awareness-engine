<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Timeline | Incident Awareness Dashboard</title>
    <link rel="stylesheet" href="/dashboard-assets/dashboard-shell.css">
    <link rel="stylesheet" href="/dashboard-assets/detail.css">
    <script type="module" src="/dashboard-assets/event-timeline.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <div class="app-brand">
                <a class="app-brand__name" href="/dashboard">Detection Hub</a>
                <span class="app-brand__context">Incident Awareness Dashboard</span>
            </div>
            <nav class="app-navigation" aria-label="주요 화면">
                <a href="/dashboard" aria-current="page">운영 현황</a>
                <a href="/dashboard/evaluation">성능 평가</a>
                <a href="/operations">시스템 운영</a>
            </nav>
        </div>
    </header>
    <main id="event-timeline-view" class="app-page detail-page">
        <header class="page-header">
            <p class="page-eyebrow">Event chronology</p>
            <h1 class="page-title">Event Timeline</h1>
            <p class="page-description">한 분석에 저장된 Normalized Event를 시간순으로 조회합니다.</p>
        </header>
        <div id="event-timeline-status" class="status-message detail-status" role="status" aria-live="polite">
            Event Timeline is prepared for loading.
        </div>
        <div class="detail-grid">
            <section
                class="section-card detail-section detail-section--summary"
                aria-labelledby="event-timeline-summary-heading"
            >
                <div class="section-header">
                    <h2 id="event-timeline-summary-heading" class="section-heading">Timeline Summary</h2>
                </div>
                <dl id="event-timeline-summary" class="detail-fields"></dl>
            </section>
            <section
                class="section-card detail-section detail-section--wide"
                aria-labelledby="event-timeline-list-heading"
            >
                <div class="section-header">
                    <h2 id="event-timeline-list-heading" class="section-heading">Events</h2>
                </div>
                <div class="event-timeline-controls">
                    <label for="event-timeline-type">Event 유형 (현재 페이지)</label>
                    <select id="event-timeline-type" aria-controls="event-timeline-list"
                            aria-describedby="event-timeline-filter-scope" disabled>
                        <option value="all">전체 유형</option>
                    </select>
                    <button id="event-timeline-filter-reset" type="button"
                            aria-label="현재 Event 페이지 유형 필터 초기화" disabled>유형 초기화</button>
                </div>
                <p id="event-timeline-filter-scope" class="detail-placeholder">현재 받은 페이지의 Event만 필터링합니다. 전체 분석의 Event를 검색하지 않으며 이전/다음은 API 페이지 단위로 이동합니다.</p>
                <p id="event-timeline-filter-status" class="event-timeline-filter-status" role="status" aria-live="polite"></p>
                <div id="event-timeline-list" class="event-timeline-list"></div>
                <nav
                    id="event-timeline-pagination"
                    class="detail-back-navigation"
                    aria-label="Event Timeline pagination"
                ></nav>
            </section>
        </div>
        <nav
            id="run-detail-back-navigation"
            class="detail-back-navigation"
            aria-label="Event Timeline navigation"
        ></nav>
    </main>
</body>
</html>
