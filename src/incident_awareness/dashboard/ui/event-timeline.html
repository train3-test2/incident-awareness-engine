<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Timeline | Incident Awareness Dashboard</title>
    <link rel="stylesheet" href="/dashboard-assets/detail.css">
    <script type="module" src="/dashboard-assets/event-timeline.js"></script>
</head>
<body>
    <main id="event-timeline-view" class="detail-page">
        <nav class="dashboard-navigation" aria-label="Dashboard navigation">
            <a href="/dashboard" aria-current="page">Dashboard</a>
            <a href="/operations">Operations</a>
        </nav>
        <h1 class="page-title">Event Timeline</h1>
        <p>Read-only chronological view of the Normalized Events stored for this run.</p>
        <div id="event-timeline-status" class="detail-status" role="status" aria-live="polite">
            Event Timeline is prepared for loading.
        </div>
        <div class="detail-grid">
            <section class="detail-section" aria-labelledby="event-timeline-summary-heading">
                <h2 id="event-timeline-summary-heading">Timeline Summary</h2>
                <dl id="event-timeline-summary" class="detail-fields"></dl>
            </section>
            <section class="detail-section" aria-labelledby="event-timeline-list-heading">
                <h2 id="event-timeline-list-heading">Events</h2>
                <div id="event-timeline-list" class="event-timeline-list"></div>
                <nav
                    id="event-timeline-pagination"
                    class="detail-back-navigation"
                    aria-label="Event Timeline pagination"
                ></nav>
            </section>
        </div>
        <nav
            id="run-detail-back-navigation"
            class="detail-back-navigation"
            aria-label="Event Timeline navigation"
        ></nav>
    </main>
</body>
</html>
