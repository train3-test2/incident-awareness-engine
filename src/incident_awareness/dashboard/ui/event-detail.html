<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Detail | Incident Awareness Dashboard</title>
    <link rel="stylesheet" href="/dashboard-assets/dashboard-shell.css">
    <link rel="stylesheet" href="/dashboard-assets/detail.css">
    <script type="module" src="/dashboard-assets/event-detail.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <div class="app-brand">
                <a class="app-brand__name" href="/dashboard">Detection Hub</a>
                <span class="app-brand__context">Incident Awareness Dashboard</span>
            </div>
            <nav class="app-navigation" aria-label="주요 화면">
                <a href="/dashboard" aria-current="page">운영 View</a>
                <a href="/dashboard/evaluation">평가 View</a>
                <a href="/operations">Operations</a>
            </nav>
        </div>
    </header>
    <main id="event-detail-view" class="app-page detail-page">
        <header class="page-header">
            <p class="page-eyebrow">Event provenance</p>
            <h1 class="page-title">Event Detail</h1>
            <p class="page-description">정규화된 Event 메타데이터와 Raw Log Reference를 조회합니다.</p>
        </header>
        <div id="event-detail-status" class="status-message detail-status" role="status" aria-live="polite">
            Event Detail is prepared for loading.
        </div>
        <div class="detail-grid">
            <section class="section-card detail-section" aria-labelledby="event-detail-heading">
                <div class="section-header">
                    <h2 id="event-detail-heading" class="section-heading">Event Metadata</h2>
                </div>
                <dl id="event-detail-fields" class="detail-fields"></dl>
            </section>
            <section class="section-card detail-section" aria-labelledby="raw-log-reference-heading">
                <div class="section-header">
                    <h2 id="raw-log-reference-heading" class="section-heading">Raw Log Reference</h2>
                </div>
                <div
                    id="raw-log-reference-status"
                    class="status-message detail-section-status"
                    role="status"
                    aria-live="polite"
                >
                    Raw Log Reference is prepared for loading.
                </div>
                <dl id="raw-log-reference-fields" class="detail-fields"></dl>
            </section>
        </div>
        <nav
            id="event-timeline-back-navigation"
            class="detail-back-navigation"
            aria-label="Event Timeline navigation"
        ></nav>
        <nav
            id="run-detail-back-navigation"
            class="detail-back-navigation"
            aria-label="Run Detail navigation"
        ></nav>
    </main>
</body>
</html>
