<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historical Decision | Incident Awareness Dashboard</title>
    <link rel="stylesheet" href="/dashboard-assets/detail.css">
    <script type="module" src="/dashboard-assets/decision-detail.js"></script>
</head>
<body>
    <main id="decision-detail-view" class="detail-page">
        <nav class="dashboard-navigation" aria-label="Dashboard navigation">
            <a href="/dashboard" aria-current="page">Dashboard</a>
            <a href="/operations">Operations</a>
        </nav>
        <h1 class="page-title">Historical Decision</h1>
        <div id="decision-detail-status" class="detail-status" role="status" aria-live="polite">
            Historical Decision을 불러오는 중입니다.
        </div>
        <div class="detail-grid">
            <section class="detail-section" aria-labelledby="decision-heading">
                <h2 id="decision-heading">Decision</h2>
                <dl id="historical-decision" class="detail-fields"></dl>
            </section>
            <section class="detail-section" aria-labelledby="runtime-snapshot-heading">
                <h2 id="runtime-snapshot-heading">Historical Runtime Snapshot</h2>
                <div
                    id="runtime-snapshot-status"
                    class="detail-section-status"
                    role="status"
                    aria-live="polite"
                ></div>
            </section>
            <section class="detail-section" aria-labelledby="historical-detection-heading">
                <h2 id="historical-detection-heading">Historical Detection Runtime</h2>
                <div
                    id="historical-detection-status"
                    class="detail-section-status"
                    role="status"
                    aria-live="polite"
                ></div>
                <dl id="historical-detection" class="detail-fields"></dl>
            </section>
            <section class="detail-section" aria-labelledby="historical-fusion-heading">
                <h2 id="historical-fusion-heading">Historical Fusion Runtime</h2>
                <div
                    id="historical-fusion-status"
                    class="detail-section-status"
                    role="status"
                    aria-live="polite"
                ></div>
                <dl id="historical-fusion" class="detail-fields"></dl>
            </section>
        </div>
        <nav
            id="run-detail-back-navigation"
            class="detail-back-navigation"
            aria-label="Historical Decision navigation"
        ></nav>
    </main>
</body>
</html>
