<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historical Decision | Incident Awareness Dashboard</title>
    <link rel="stylesheet" href="/dashboard-assets/dashboard-shell.css">
    <link rel="stylesheet" href="/dashboard-assets/detail.css">
    <script type="module" src="/dashboard-assets/decision-detail.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <div class="app-brand">
                <a class="app-brand__name" href="/dashboard">Detection Hub</a>
                <span class="app-brand__context">Incident Awareness Dashboard</span>
            </div>
            <nav class="app-navigation" aria-label="주요 화면">
                <a href="/dashboard" aria-current="page">운영 View</a>
                <a href="/dashboard/evaluation">평가 View</a>
                <a href="/operations">Operations</a>
            </nav>
        </div>
    </header>
    <main id="decision-detail-view" class="app-page detail-page">
        <header class="page-header">
            <p class="page-eyebrow">Decision history</p>
            <h1 class="page-title">Historical Decision</h1>
            <p class="page-description">선택한 과거 Decision과 당시 저장된 Runtime Snapshot을 조회합니다.</p>
        </header>
        <div id="decision-detail-status" class="status-message detail-status" role="status" aria-live="polite">
            Historical Decision을 불러오는 중입니다.
        </div>
        <div class="detail-grid">
            <section class="section-card detail-section" aria-labelledby="decision-heading">
                <div class="section-header">
                    <h2 id="decision-heading" class="section-heading">Decision</h2>
                </div>
                <dl id="historical-decision" class="detail-fields"></dl>
            </section>
            <section class="section-card detail-section" aria-labelledby="runtime-snapshot-heading">
                <div class="section-header">
                    <h2 id="runtime-snapshot-heading" class="section-heading">Historical Runtime Snapshot</h2>
                </div>
                <div
                    id="runtime-snapshot-status"
                    class="status-message detail-section-status"
                    role="status"
                    aria-live="polite"
                ></div>
            </section>
            <section class="section-card detail-section" aria-labelledby="historical-detection-heading">
                <div class="section-header">
                    <h2 id="historical-detection-heading" class="section-heading">Historical Detection Runtime</h2>
                </div>
                <div
                    id="historical-detection-status"
                    class="status-message detail-section-status"
                    role="status"
                    aria-live="polite"
                ></div>
                <dl id="historical-detection" class="detail-fields"></dl>
            </section>
            <section class="section-card detail-section" aria-labelledby="historical-fusion-heading">
                <div class="section-header">
                    <h2 id="historical-fusion-heading" class="section-heading">Historical Fusion Runtime</h2>
                </div>
                <div
                    id="historical-fusion-status"
                    class="status-message detail-section-status"
                    role="status"
                    aria-live="polite"
                ></div>
                <dl id="historical-fusion" class="detail-fields"></dl>
            </section>
        </div>
        <nav
            id="run-detail-back-navigation"
            class="detail-back-navigation"
            aria-label="Historical Decision navigation"
        ></nav>
    </main>
</body>
</html>
