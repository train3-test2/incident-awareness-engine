services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_awareness}
      POSTGRES_USER: ${POSTGRES_USER:-incident_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - incident_awareness_postgres_data:/var/lib/postgresql
      - ./infra/postgres/migrations/001_first_cycle.sql:/docker-entrypoint-initdb.d/001_first_cycle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  incident_awareness_postgres_data:
